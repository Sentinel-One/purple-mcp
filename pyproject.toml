[project]
name = "purple-mcp"
version = "0.7.0"
description = "Purple AI MCP Server"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "Typing :: Typed",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta"
]
dependencies = [
    "click>=8.1",
    "fastmcp>=2.13.0.2",
    "httpx>=0.27",
    "logfire[httpx,starlette]>=4.3",
    "pandas>=2.2",
    "pydantic-settings>=2.10",
    "pydantic>=2.10",
    "python-dateutil>=2.8",
    "rfc3986~=2.0.0",
    "tenacity>=8.5",
    "typing-extensions>=4.12",
    "validators>=0.35.0",
    "vt-py>=0.22.0",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "ruff>=0.14.3",
    "types-python-dateutil>=2.9.0.20250708",
]
test = [
    "freezegun>=1.5.3",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.2.1",
    "pytest-rerunfailures>=16.1",
    "pytest-xdist>=3.8.0",
    "pytest>=8.4.2",
    "respx>=0.22.0",
]

[tool.uv]
default-groups = [
    "dev",
    "test"
]
resolution = "lowest-direct"

[project.scripts]
purple-mcp = "purple_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/purple_mcp", "tests"]

[tool.hatch.build.targets.wheel]
include = ["src/purple_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/purple_mcp" = "purple_mcp"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
allow_redefinition_new = true
local_partial_types = true
#disallow_any_explicit = true @TODO
disallow_any_generics = true
disallow_subclassing_any = true
plugins = [
    "pydantic.mypy"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--strict-config",
    "--strict-markers"
]
# Use session-wide event loops over isolated ones due to pytest-asyncio issues.
# Ref: https://github.com/pytest-dev/pytest-asyncio/issues/724, https://github.com/pytest-dev/pytest-asyncio/issues/1134
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
asyncio_debug = true
xfail_strict = true
